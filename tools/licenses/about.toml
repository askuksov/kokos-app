# cargo-about configuration for the Kokos third-party notice file.
# Install the tool with:  cargo install --locked cargo-about --features cli
# (the plain `cargo install --locked cargo-about` builds fine but installs no
# binary on 0.9.x: the `cargo-about` bin target is gated behind the `cli`
# feature, which is not on by default. Confirmed against cargo-about 0.9.2.)
#
# `accepted` mirrors deny.toml's allow-list. A licence appearing here that is
# NOT in deny.toml (or the reverse) is a bug — the two lists must agree.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]

# Our own crates (publish = false) are not third-party and must never appear
# in a third-party file.
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }

# Every target we ship. Without this, cargo-about only walks the host triple
# and the Linux-only and Windows-only dependency subtrees are silently absent.
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

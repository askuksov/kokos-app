# Release builds for macOS (Apple Silicon), Windows and Linux.
#
# A pushed tag `vX.Y.Z` builds every platform and attaches the Windows and
# Linux installers and a SHA256SUMS file to a DRAFT release. Nothing is
# published automatically. The macOS DMG is signed with the Developer ID and
# notarized on the maintainer's Mac, so the CI build only proves that macOS
# still builds and is not attached. Before publishing: add the notarized DMG,
# regenerate SHA256SUMS, upload its detached signature.
# A pull request that changes this file runs the builds without a release.
#
# No build cache is used: a release of a password manager is built from a
# clean checkout every time.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.90.0'
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that all version fields agree
        id: check
        run: |
          app=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tauri.conf.json=$app package.json=$pkg Cargo.toml=$crate"
          [ "$app" = "$pkg" ] && [ "$app" = "$crate" ] || { echo "::error::version fields disagree"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $app"; exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Fetch dependencies
        run: |
          npm ci
          cargo fetch --locked
      - name: Stage the native-messaging host
        run: |
          cargo build --release --locked -p kokos-nmh
          triple=$(rustc -vV | sed -n 's/^host: //p')
          cp target/release/kokos-nmh "src-tauri/binaries/kokos-nmh-$triple"
      # Signed ad hoc: the identity in tauri.conf.json exists only on the
      # maintainer's machine.
      - name: Build the DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    needs: version
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Fetch dependencies
        run: |
          npm ci
          cargo fetch --locked
      - name: Stage ONNX Runtime
        shell: pwsh
        run: ./packaging/windows/fetch-onnxruntime.ps1
      - name: Stage the native-messaging host
        run: |
          cargo build --release --locked -p kokos-nmh
          triple=$(rustc -vV | sed -n 's/^host: //p')
          cp target/release/kokos-nmh.exe "src-tauri/binaries/kokos-nmh-$triple.exe"
      # NSIS only: it bundles just the declared resources. The installer is
      # not code-signed yet.
      - name: Build the installer
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: version
    # Ubuntu 24.04 matches the glibc 2.39 floor the deb and rpm declare.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal && rustup default "$RUST_TOOLCHAIN"
      - name: Fetch dependencies
        run: |
          npm ci
          cargo fetch --locked
      - name: Stage the native-messaging host
        run: |
          cargo build --release --locked -p kokos-nmh
          triple=$(rustc -vV | sed -n 's/^host: //p')
          cp target/release/kokos-nmh "src-tauri/binaries/kokos-nmh-$triple"
      - name: Build the packages
        env:
          # linuxdeploy is itself an AppImage; the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri build -- --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, build-macos, build-windows, build-linux]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux
          path: dist
      # The Linux artifact keeps its deb/, rpm/ and appimage/ folders; the
      # release takes plain files.
      - name: Collect the files and write SHA256SUMS
        run: |
          mkdir out
          find dist -type f -exec mv -n -t out {} +
          cd out
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Kokos $VERSION" --notes "" out/*

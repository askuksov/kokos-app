# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  high_level_summary: true
  poem: false
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!vendor/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!THIRD-PARTY-NOTICES.md"
    - "!**/icons/**"
    - "!public/icon/**"
chat:
  auto_reply: true

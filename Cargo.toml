[workspace]
members = ["kokos-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# Floor set by dependencies: ort 2.0.0-rc.13, image, time, plist and darling
# declare rust-version 1.88. Active toolchain is 1.90.
rust-version = "1.88"
# Application crates, never published to crates.io.
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "2"

[profile.dev.package."*"]
opt-level = 3

# Vendored keepass 0.8.7 hardened for untrusted KDBX input. Divergences from
# crates.io 0.8.7 (each marked "Kokos patch" in the source); everything else
# is verbatim:
# - parse nesting-depth guard for Group and Entry/History recursion
#   (src/error.rs, src/xml_db/parse/), so deep nesting fails instead of
#   overflowing the stack;
# - KDF cost bounds (Argon2 memory/iterations/lanes, AES rounds) checked at
#   header parse, before any key transform (src/config.rs, src/format/);
# - 1 GiB cap on decompressed payload (src/compression.rs);
# - db::History.entries widened to pub for the depth-guard regression test.
[patch.crates-io]
keepass = { path = "vendor/keepass-0.8.7" }
